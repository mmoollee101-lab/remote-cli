name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install rcli dependencies
        run: npm install --production --legacy-peer-deps

      - name: Install law-bot dependencies
        run: |
          if (Test-Path 'law-bot/package.json') {
            Push-Location law-bot
            npm install --production --legacy-peer-deps
            Pop-Location
          }
        shell: pwsh

      - name: Build rcli launcher exe
        run: |
          mkdir dist -ErrorAction SilentlyContinue
          & "C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /target:winexe /win32icon:app.ico /out:"dist\Claude Telegram Bot.exe" launcher.cs
        shell: pwsh

      - name: Generate law-bot icon
        run: |
          if (-not (Test-Path 'law-app.ico')) {
            & powershell -ExecutionPolicy Bypass -File make-law-icon.ps1
          }
        shell: pwsh

      - name: Build law-bot launcher exe
        run: |
          & "C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /target:winexe /win32icon:law-app.ico /out:"dist\Law Bot.exe" law-launcher.cs
        shell: pwsh

      - name: Package rcli portable zip
        run: |
          $dest = "release\rcli-${{ github.ref_name }}"
          mkdir $dest -Force | Out-Null
          mkdir "$dest\dist" -Force | Out-Null

          $files = @(
            'bot.js', 'utils.js', 'i18n.js', 'commands.js', 'config.js',
            'package.json', 'package-lock.json', '.env.example',
            'launcher.cs', 'app.ico', 'README.md'
          )
          foreach ($f in $files) {
            if (Test-Path $f) { Copy-Item $f $dest }
          }
          Copy-Item -Recurse node_modules "$dest\node_modules"
          Copy-Item "dist\Claude Telegram Bot.exe" "$dest\dist\"

          # rcli-only setup.bat (no law-bot build step)
          if (Test-Path 'release_assets\rcli-setup.bat') {
            Copy-Item 'release_assets\rcli-setup.bat' "$dest\setup.bat"
          } else {
            Copy-Item 'setup.bat' "$dest\setup.bat"
          }

          Compress-Archive -Path "$dest\*" -DestinationPath "rcli-${{ github.ref_name }}.zip" -CompressionLevel Optimal -Force
        shell: pwsh

      - name: Package law-bot portable zip
        run: |
          $dest = "release\law-bot-${{ github.ref_name }}"
          mkdir $dest -Force | Out-Null
          mkdir "$dest\dist" -Force | Out-Null
          mkdir "$dest\law-bot" -Force | Out-Null

          # Root files for law-bot package
          $rootFiles = @(
            'law-launcher.cs', 'law-app.ico', 'make-law-icon.ps1'
          )
          foreach ($f in $rootFiles) {
            if (Test-Path $f) { Copy-Item $f $dest }
          }

          # law-bot folder
          foreach ($f in @('law-bot.js', 'law-tools.js', 'config.js', 'package.json', 'package-lock.json')) {
            if (Test-Path "law-bot\$f") { Copy-Item "law-bot\$f" "$dest\law-bot\" }
          }
          if (Test-Path 'law-bot\node_modules') {
            Copy-Item -Recurse 'law-bot\node_modules' "$dest\law-bot\node_modules"
          }
          Copy-Item "dist\Law Bot.exe" "$dest\dist\"

          # law-bot specific setup.bat (separate from root setup.bat)
          if (Test-Path 'release_assets\law-bot-setup.bat') {
            Copy-Item 'release_assets\law-bot-setup.bat' "$dest\setup.bat"
          }
          if (Test-Path 'release_assets\law-bot-README.md') {
            Copy-Item 'release_assets\law-bot-README.md' "$dest\README.md"
          }

          Compress-Archive -Path "$dest\*" -DestinationPath "law-bot-${{ github.ref_name }}.zip" -CompressionLevel Optimal -Force
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rcli-*.zip
            law-bot-*.zip
          generate_release_notes: true
